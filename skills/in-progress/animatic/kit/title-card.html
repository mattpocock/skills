<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Frame example: title card</title>
    <!--
      THE STYLESHEET IS THE CONTRACT; THIS MARKUP IS NOT. Copy this file, keep
      the <link>, rewrite the words.

      A plain plate: an uppercase kicker, a white headline, a short accent
      rule and at most one supporting line. Use it for the opening frame, a section break,
      or the one sentence a moment is really about.

      Say ONE thing. If the card needs a second supporting line it is probably
      two moments.
    -->
    <link rel="stylesheet" href="./house.css" />
  </head>
  <body>
    <div class="frame frame--center">
      <div class="card">
        <div class="kicker">PR #214 &middot; acme-api</div>
        <h1 class="headline">
          One limit per key,<br />not per building
          <span class="rule"></span>
        </h1>
        <p class="subhead">Every customer behind our load balancer shared one bucket.</p>
      </div>
    </div>
  </body>
</html>
